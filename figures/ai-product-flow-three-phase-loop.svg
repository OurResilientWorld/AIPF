<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="372" viewBox="0 0 1280 372" role="img" aria-labelledby="title desc">
  <title id="title">Three-phase AI Product Flow</title>
  <desc id="desc">An idea moves through Phase 1: Validate, Show and Set Boundaries; Phase 2: Build the Steel Thread; and Phase 3: Decide the Next Investment. Each phase ends at a gate allowing Proceed, Revise, Defer, or Stop; Gate 3 also allows Scale. An arrow loops back when new evidence appears.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#34758a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#15384b" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="372" rx="16" fill="#f6f9fb"/>
  <text x="52" y="44" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#12364c">AI PRODUCT FLOW</text>
  <text x="1230" y="43" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#587080">Three phases · small experiments · evidence-based decisions</text>
  <text x="28" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#12364c">IDEA</text>
  <path d="M67 140H87" stroke="#34758a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="96" y="82" width="330" height="194" rx="12" fill="#fff" stroke="#bad4de"/>
    <rect x="96" y="82" width="330" height="13" rx="6" fill="#25647b"/>
    <rect x="476" y="82" width="330" height="194" rx="12" fill="#fff" stroke="#bad4de"/>
    <rect x="476" y="82" width="330" height="13" rx="6" fill="#20788a"/>
    <rect x="856" y="82" width="330" height="194" rx="12" fill="#fff" stroke="#bad4de"/>
    <rect x="856" y="82" width="330" height="13" rx="6" fill="#176c62"/>
  </g>
  <path d="M428 170H465" stroke="#34758a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M808 170H845" stroke="#34758a" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#173d51">
    <text x="118" y="124" font-size="13" font-weight="700" fill="#25647b">PHASE 1</text>
    <text x="118" y="148" font-size="19" font-weight="700">Validate, Show and</text>
    <text x="118" y="173" font-size="19" font-weight="700">Set Boundaries</text>
    <text x="118" y="205" font-size="14">HTML simulation + steel thread brief</text>
    <text x="118" y="237" font-size="14" font-weight="700">GATE 1</text>
    <text x="118" y="257" font-size="11" fill="#506877">Proceed · Revise · Defer · Stop</text>

    <text x="498" y="124" font-size="13" font-weight="700" fill="#20788a">PHASE 2</text>
    <text x="498" y="149" font-size="19" font-weight="700">Build the Steel Thread</text>
    <text x="498" y="181" font-size="14">One real end-to-end use case</text>
    <text x="498" y="205" font-size="14">+ tests, cost and evidence</text>
    <text x="498" y="237" font-size="14" font-weight="700">GATE 2</text>
    <text x="498" y="257" font-size="11" fill="#506877">Proceed · Revise · Defer · Stop</text>

    <text x="878" y="124" font-size="13" font-weight="700" fill="#176c62">PHASE 3</text>
    <text x="878" y="149" font-size="19" font-weight="700">Decide the Next Investment</text>
    <text x="878" y="181" font-size="14">MVP/pilot investment decision</text>
    <text x="878" y="205" font-size="14">+ cost, risk and operating outline</text>
    <text x="878" y="237" font-size="14" font-weight="700">GATE 3</text>
    <text x="878" y="257" font-size="11" fill="#506877">Proceed · Revise · Defer · Stop · Scale</text>
  </g>
  <path d="M1120 279V313Q1120 328 1103 328H202Q184 328 184 310V288" stroke="#34758a" stroke-width="2.8" stroke-dasharray="8 5" fill="none" marker-end="url(#arrow)"/>
  <rect x="451" y="311" width="372" height="34" rx="17" fill="#e9f3f6"/>
  <text x="637" y="333" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="14" fill="#1a596b">New evidence or changing conditions → review and revise</text>
</svg>
