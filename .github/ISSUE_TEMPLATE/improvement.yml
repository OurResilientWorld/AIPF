name: Improvement proposal
description: Tell us what needs improving in AIPF and why.
title: 'Improvement proposal: '
labels:
- improvement
- triage
body:
- type: markdown
  attributes:
    value: >-
      Tell us what needs improving and why. You do not need to propose a solution
      or design a test. The other text fields are optional. Issues are public;
      do not include confidential, sensitive or personal information.
      Submission does not imply endorsement, funding or acceptance.
- type: textarea
  id: question
  attributes:
    label: What needs improving, and why?
    description: Describe what is unclear, missing or difficult, and how it affects you.
  validations:
    required: true
- type: input
  id: gap
  attributes:
    label: Guide, case study or page
    description: Optional. Add a page link or heading if you know it; leave blank for a general suggestion.
  validations:
    required: false
- type: textarea
  id: design
  attributes:
    label: Your suggestion, if you have one
    description: Optional. Share an idea or example. You do not need to explain how to build or test it.
  validations:
    required: false
- type: textarea
  id: outcomes
  attributes:
    label: What would be better for you?
    description: Optional. Explain the benefit if it is not already clear from your main answer.
  validations:
    required: false
- type: textarea
  id: adverse
  attributes:
    label: Anything else we should consider?
    description: Optional. Add limitations, concerns or reasons your suggestion might not help.
  validations:
    required: false
- type: checkboxes
  id: checks
  attributes:
    label: Public submission acknowledgement
    options:
    - label: I have not included confidential, sensitive or personal information.
      required: true
